<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>formparameter</title>
    </head>
    <body>
        <form method="POST" action="/formparameter">
            <input type="text" name="text" placeholder="text"/><br/>
            <input type="number" name="number" placeholder="number"/><br/>
            <input type="date" value="date" name="date"/><br/>
            <input type="checkbox" value="yes" name="checkbox"/>yes<br/>
            <input type="checkbox" value="no" name="checkbox"/>no<br/>
            <input type="radio" value="opt1" name="radio"/>option 1<br/>
            <input type="radio" value="opt2" name="radio"/> option 2<br/>
            <textarea name="textarea">Hello</textarea><br/>
            <input type="submit" value="send1" name="send"/>
            <input type="submit" value="send2" name="send"/>
        </form>
    </body>
</html>
