<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>05-01</title>
    </head>
    <body>
        <button onclick="Get()">Get</button>
        <div id="show-all" style="margin-top: 20px; margin-bottom: 30px;"></div>
        
        <div id="form-container" style="margin-top: 50px;">
            <h3>POST</h3>
            <div class="row">
                <label>Name:</label>
                <input type="text" id="name-getter">
            </div>
            <div class="row">
                <label>Birthday:</label>
                <input type="date" id="bday-getter">
            </div>
            <div class="row">
                <button onclick="Post()">POST</button>
            </div>
        </div>
        
        <div id="put-container" style="margin-top: 50px;">
            <h3>PUT</h3>
            <div class="row">
                <label>Id:</label>
                <input type="number" id="put-id-getter" min="1">
            </div>
            <div class="row">
                <label>Name:</label>
                <input type="text" id="put-name-getter">
            </div>
            <div class="row">
                <label>Birthday:</label>
                <input type="date" id="put-bday-getter">
            </div>
            <div class="row">
                <button onclick="Put()">PUT</button>
            </div>
        </div>
        
        <div id="delete-container" style="margin-top: 50px;">
            <h3>DELETE</h3>
            <div class="row">
                <label>Id:</label>
                <input type="number" id="delete-id-getter" min="1">
            </div>
            <div class="row">
                <button onclick="Delete()">DELETE</button>
            </div>
        </div>

        <div id="stats-container" style="margin-top: 50px;">
            <h3>STATS</h3>
            <button onclick="getStats()">Get statistics</button>
            <pre id="stats"></pre>
        </div>
    </body>

<script>
  function Get() {
    var resultContainer = document.getElementById('show-all');
    console.log('GET pressed');
    fetch("/api/db", {
      method: "GET",
      headers: { 'content-type': 'application/json;charset=utf-8', 'accept': 'application/json' }
    })
      .then(response => { return response.json(); })
      .then((data) => {
        resultContainer.innerHTML = '<h3>GET Result:</h3>';
        data.forEach(element => {
          resultContainer.innerHTML += `<p>${element.id}: ${element.name} ${element.bday}</p>`;
        });
      })
      .catch(err => console.log('GET ERROR:', err));
  }

  function Post() {
    let NAME = document.getElementById('name-getter');
    let BDAY = document.getElementById('bday-getter');
    console.log('POST pressed');
    fetch("/api/db", {
      method: "POST",
      headers: { 'content-type': 'application/json;charset=utf-8', 'accept': 'application/json' },
      body: JSON.stringify({ name: NAME.value, bday: BDAY.value })
    })
      .then(response => { return response.json() })
      .then((data) => {
        console.log('Data posted:', data);
        NAME.value = "";
        BDAY.value = "";
        Get();
      })
      .catch(err => { console.log(`POST ERROR: ${err}`) })
  }

  function Put() {
    let PID = document.getElementById('put-id-getter');
    let PNAME = document.getElementById('put-name-getter');
    let PBDAY = document.getElementById('put-bday-getter');
    console.log('PUT pressed');
    fetch(`/api/db?id=${PID.value}`, {
      method: "PUT",
      headers: { 'content-type': 'application/json;charset=utf-8', 'accept': 'application/json' },
      body: JSON.stringify({ name: PNAME.value, bday: PBDAY.value })
    })
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error. Code: ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        console.log('Updated data:', data);
        PID.value = "";
        PNAME.value = "";
        PBDAY.value = "";
        Get(); 
      })
      .catch(err => {
        console.log(`PUT ERROR: ${err}`);
      })
  }

  function Delete() {
    let DID = document.getElementById('delete-id-getter');
    if (!DID.value) {
      console.error('ID is not present');
      return;
    }

    console.log('DELETE pressed');
    fetch(`/api/db?id=${DID.value}`, {
      method: "DELETE",
      headers: { 'content-type': 'application/json;charset=utf-8', 'accept': 'application/json' },
    })
      .then(response => {
        if (!response.ok) {
          throw new Error(`Delete response was not OK ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        console.log('Deleted:', data);
        DID.value = "";
        Get();
      })
      .catch((err) => {
        console.log(`DELETE ERROR: ${err}`);
      })
  }

  async function getStats() {
    let res = await fetch('/api/ss');
    let data = await res.json();
    document.getElementById('stats').innerHTML = JSON.stringify(data, null, 2);
  }
</script>
</html>
